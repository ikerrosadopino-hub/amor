<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Para mi loquita</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =========================
         FONDO
    ========================== -->

    <div class="fondo"></div>

    <div id="estrellas"></div>

    <div id="petalos"></div>

    <div id="corazones"></div>


    <!-- =========================
         PRIMERA PANTALLA
    ========================== -->

    <main class="intro" id="intro">


        <!-- =========================
             SOBRE CERRADO
        ========================== -->

        <div class="sobre-container" id="sobreContainer">

            <div class="sobre">

                <!-- Parte trasera -->

                <div class="sobre-base"></div>


                <!-- Solapa -->

                <div class="solapa" id="solapa"></div>


                <!-- Corazón -->

                <div class="sello" id="sello">
                    💛
                </div>


                <!-- Texto -->

                <div class="texto-sobre">
                    Para mi amor
                </div>

            </div>


            <!-- Botón abrir -->

            <button
                class="boton-abrir"
                id="abrir"
            >
                Abrir 💌
            </button>

        </div>


        <!-- =========================
             CARTA
        ========================== -->

        <div class="carta" id="carta">

            <div class="decoracion-carta">
                🌼 ✨ 🌼
            </div>


            <h1>
                Hola Amor 💛
            </h1>


            <p>
                Como estás lejos pensarás que no podrás
                tener tus flores...
            </p>


            <p class="peroooo">
                peroooooo...
            </p>


            <p class="pequeno">
                dale a continuar 🌻
            </p>


            <!-- Botón corazón -->

            <button
                class="boton-corazon"
                id="continuar"
            >

                <span>
                    Continuar
                </span>

            </button>

        </div>


    </main>



    <!-- =========================
         ESCENA FINAL
    ========================== -->

    <section
        class="escena-final"
        id="final"
    >


        <!-- Luna -->

        <div class="luna"></div>


        <!-- Estrellas -->

        <div class="estrellas-finales"></div>


        <!-- Suelo -->

        <div class="suelo"></div>


        <!-- =========================
             FLORES
        ========================== -->

        <div class="ramo">


            <!-- FLOR IZQUIERDA -->

            <div class="flor flor-izquierda">

                <div class="petalos">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="centro-flor"></div>


                <div class="tallo">

                    <div class="hoja hoja1"></div>

                    <div class="hoja hoja2"></div>

                </div>

            </div>



            <!-- FLOR CENTRAL -->

            <div class="flor flor-central">

                <div class="petalos">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="centro-flor"></div>


                <div class="tallo">

                    <div class="hoja hoja1"></div>

                    <div class="hoja hoja2"></div>

                </div>

            </div>



            <!-- FLOR DERECHA -->

            <div class="flor flor-derecha">

                <div class="petalos">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="centro-flor"></div>


                <div class="tallo">

                    <div class="hoja hoja1"></div>

                    <div class="hoja hoja2"></div>

                </div>

            </div>


        </div>


        <!-- =========================
             MENSAJE FINAL
        ========================== -->

        <div class="mensaje-final">

            <div class="decoracion-final">
                ✦ 🌼 ✦
            </div>


            <h2>
                TE AMO
                <br>
                MI VIDA
            </h2>


            <p>
                Aunque estés lejos...
            </p>


            <p class="frase-final">

                estas flores son para ti.

                <br>

                💛🌻💛

            </p>


            <div class="corazon-final">
                ♥
            </div>

        </div>


        <!-- Música -->

        <button
            class="musica"
            id="musica"
        >
            ♫
        </button>


    </section>



    <!-- =========================
         MÚSICA
    ========================== -->

    <audio
        id="audio"
        loop
    >

        <source
            src="cancion.mp3"
            type="audio/mpeg"
        >

    </audio>


    <script src="script.js"></script>

</body>

</html>
